name: Build installers

# Runs the tests, builds installers for Windows, macOS and Linux, and smoke-tests
# each packaged app against the simulated keyboard. Pushing a version tag
# (`npm run release:patch`, or `git tag v0.2.0 && git push --tags`) also
# publishes a GitHub Release with the installers attached.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            smoke: release/win-unpacked/Keyboard Lighting.exe
          - os: macos-latest
            target: --mac
            smoke: release/mac-universal/Keyboard Lighting.app/Contents/MacOS/Keyboard Lighting
          - os: ubuntu-latest
            target: --linux
            smoke: release/linux-unpacked/via-app
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificates yet; builds are unsigned (macOS: ad-hoc).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Generate Linux package scripts
        if: runner.os == 'Linux'
        run: node scripts/linux-package-scripts.cjs
      - run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Smoke test (Windows / macOS)
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs "${{ matrix.smoke }}"
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        # The unpacked app isn't installed, so Ubuntu 24's AppArmor blocks
        # Chromium's sandbox (SIGTRAP). The .deb installs a profile for users.
        run: xvfb-run -a node scripts/smoke.mjs "${{ matrix.smoke }}" --no-sandbox

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # One job creates the release and attaches everything, so the three build
      # jobs can't race to create duplicate releases for the same tag.
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          make_latest: true
